<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumen · 个人助手</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div class="brand"><span class="orb">✦</span><strong>Lumen</strong><span class="version">v0.4.0</span></div><span id="status">你的个人对话助手</span><button id="new-conversation" class="subtle">新对话</button><button id="access" class="subtle">访问令牌</button></header>
<main><section class="conversation"><div id="messages" aria-live="polite"></div><div id="notice" role="status"></div><form id="chat"><textarea id="input" rows="2" placeholder="和我聊聊，或让我帮你记住、记录、提醒…" aria-label="消息" required maxlength="8000"></textarea><button id="send" type="submit">发送 ↑</button></form><p class="hint">Enter 发送 · Shift + Enter 换行 · 提醒需要服务保持运行</p></section>
<aside><nav><button class="tab active" data-tab="todos">待办 <span id="todo-count"></span></button><button class="tab" data-tab="memories">记忆</button><button class="tab" data-tab="schedules">定时</button><button class="tab" data-tab="notes">笔记</button><button class="tab" data-tab="projects">项目</button></nav>
<section class="panel" id="todos"><h2>把事情一件件做好</h2><form id="todo-form" class="inline"><input name="title" placeholder="添加一件待办" aria-label="待办标题" required maxlength="4000"><button>＋</button></form><div class="filters"><select id="todo-filter" aria-label="任务筛选"><option value="all">全部任务</option><option value="open">未完成</option><option value="done">已完成</option><option value="high">高优先级</option></select></div><div id="todo-list"></div></section>
<section class="panel" id="memories" hidden><h2>我记住的关于你</h2><p class="muted">明确告诉我「记住」，信息会保存在这里。你可以随时修改或忘记。</p><form id="memory-form"><input name="key" placeholder="信息名称，如：称呼、饮食偏好" aria-label="记忆名称" required><textarea name="content" placeholder="希望我记住的内容" aria-label="记忆内容" required></textarea><button>保存记忆</button></form><div id="memory-list"></div></section>
<section class="panel" id="schedules" hidden><h2>到时间，我会来提醒</h2><p class="muted">结果出现在对话里。浏览器关闭也会执行，服务需要保持运行。</p><form id="schedule-form"><input name="title" placeholder="任务名称" aria-label="任务名称" required><textarea name="prompt" placeholder="提醒内容，或要 Agent 执行的任务" aria-label="任务内容" required></textarea><label>执行时间 <input name="run_at" type="datetime-local" required></label><p class="muted" id="zone"></p><div class="inline"><select name="kind" aria-label="任务类型"><option value="reminder">提醒</option><option value="agent">执行 Agent 任务</option></select><select name="repeat" aria-label="重复频率"><option value="none">仅一次</option><option value="daily">每天</option><option value="weekly">每周</option></select></div><button>创建任务</button></form><div id="schedule-list"></div><h3>最近执行</h3><div id="run-list"></div><h3>飞书发送</h3><div id="delivery-list"></div></section>
<section class="panel" id="notes" hidden><h2>想法与资料，随时找回</h2><form id="note-form"><input name="title" placeholder="笔记标题" required aria-label="笔记标题"><textarea name="content" placeholder="记录你的想法、资料或摘录…" required aria-label="笔记内容"></textarea><input name="tags" placeholder="标签，如：工作 学习" aria-label="笔记标签"><button>保存笔记</button></form><input id="note-search" placeholder="搜索笔记" aria-label="搜索笔记"><div id="note-list"></div></section>
<section class="panel" id="projects" hidden><h2>把目标变成进展</h2><form id="project-form"><input name="title" placeholder="项目名称" required aria-label="项目名称"><textarea name="goal" placeholder="希望达成什么？" aria-label="项目目标"></textarea><button>创建项目</button></form><div id="project-list"></div><h3>待确认计划</h3><form id="plan-form"><input name="title" placeholder="计划名称" required aria-label="计划名称"><textarea name="goal" placeholder="计划目标" aria-label="计划目标"></textarea><textarea name="steps" placeholder="每行一项任务" required aria-label="计划步骤"></textarea><button>保存计划草稿</button></form><div id="plan-list"></div></section></aside></main></body></html>
